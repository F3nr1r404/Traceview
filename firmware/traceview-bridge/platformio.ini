; TraceView Truck Bridge — M5Stack CoreS3 + CANBus Unit (U085) on Port C
; Build & upload: open this folder in VS Code with the PlatformIO extension, plug in the CoreS3, press Upload (→).

[env:m5stack-cores3]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -I ../shared
lib_deps =
    m5stack/M5Unified@^0.2.2
