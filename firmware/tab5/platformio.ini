; TraceView Tab5 — truck reader + phone-app replacement + Wi-Fi hotspot for the glasses
; Board: M5Stack Tab5 (ESP32-P4 + ESP32-C6). Env copied from M5Stack's Tab5 docs, plus the shared decoder path.
; Build & upload: open this folder in VS Code (PlatformIO), plug the Tab5 into USB-C, press Upload (→).

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
upload_speed = 1500000
monitor_speed = 115200
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I ../shared
lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git
